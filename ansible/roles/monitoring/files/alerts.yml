groups:
  - name: system_alerts
    rules:

      - alert: HighDiskUsage
        expr: (node_filesystem_size_bytes{mountpoint="/"} - node_filesystem_avail_bytes{mountpoint="/"}) / node_filesystem_size_bytes{mountpoint="/"} * 100 > 70
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Disk usage above 70%"
          description: "Disk utilization on the server is above 70%" 

